# ─── Nong-Kati — CI Pipeline ────────────────────────────
# Default (and deployed) branch is `master` — Vercel Git
# integration handles deployments; CI gates every push/PR.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ─── Lint & Typecheck ────────────────────────────────
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # --max-warnings=0 lands once the 17 pre-existing warnings are cleaned up;
      # errors still fail the build.
      - run: npx eslint .
      - run: npx tsc --noEmit

  # ─── Dependency Audit ─────────────────────────────────
  # Non-blocking: the remaining advisories live in next@14 itself (critical
  # DoS/request-smuggling class) and are only fixed by the planned major
  # Next.js upgrade — a separate pass. The report is always uploaded so new
  # advisories stay visible without holding every build hostage.
  audit:
    name: Security Audit (report)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: npm audit (full report)
        run: |
          npm audit --json > audit-report.json || true
          npm audit --audit-level=high || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-report
          path: audit-report.json

  # ─── Unit Tests ───────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm test

  # ─── Build ────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NK_JWT_SECRET: ci-test-secret
          NK_ENCRYPTION_KEY: ci-test-encryption-key-32bytes!!
          NK_CSP_REPORT_ONLY: "true"
          # Prerendering never queries these — CI has no database.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
