# ─── Nong-Kati — CI Pipeline ────────────────────────────
# Default (and deployed) branch is `master` — Vercel Git
# integration handles deployments; CI gates every push/PR.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ─── Lint & Typecheck ────────────────────────────────
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (pinned)
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # --max-warnings=0 lands once the 17 pre-existing warnings are cleaned up;
      # errors still fail the build.
      - run: npx eslint .
      - run: npx tsc --noEmit

  # ─── Dependency Audit ─────────────────────────────────
  # Blocking (was report-only): after the Next.js 15.5 upgrade there are no
  # known high/critical advisories in the tree, so a failure is a real
  # regression and should hold the deploy. The full JSON report is still
  # uploaded on every run.
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (pinned)
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: npm audit (report + gate)
        if: always()
        run: |
          npm audit --json > audit-report.json || true

          # ── BLOCKING: the production tree only ────────────────────────
          # These dependencies actually run in the deployed app, so a high
          # advisory here is real risk and must stop a release.
          npm audit --audit-level=high --omit=dev

          # ── NOT blocking, but never silent ─────────────────────────────
          # The advisories this job used to die on are all dev-toolchain:
          # tailwindcss -> micromatch/chokidar -> braces, and
          # eslint-config-next -> fast-glob -> micromatch -> braces. Those run
          # only in the lint/build toolchain, never in production.
          #
          # They also cannot be remediated here. `braces` has NO patched
          # release at any version — 3.0.3 is the newest ever published, the
          # advisory range is `*`, and the only "fix" npm offers is
          # tailwindcss@4, a breaking major that would mean rewriting the
          # Tailwind config, the PostCSS setup, and re-validating the six
          # design-token gates that scan class usage. A CI blocking gate is
          # the wrong place to force that decision.
          #
          # So: gate production, surface dev as warnings, keep the full JSON
          # as an artifact. Nothing is hidden and nothing is forgotten.
          npm audit --json 2>/dev/null | node -e '
            let raw = "";
            process.stdin.on("data", (d) => (raw += d));
            process.stdin.on("end", () => {
              const vulns = JSON.parse(raw).vulnerabilities ?? {};
              const bad = Object.entries(vulns).filter(
                ([, v]) => v.severity === "high" || v.severity === "critical",
              );
              if (bad.length === 0) {
                console.log("no high/critical advisories anywhere");
                return;
              }
              for (const [name, v] of bad) {
                console.log(
                  `::warning title=dev-only advisory: ${name} (${v.severity})::` +
                    `in the dev tree only, so it does not block. Fix available: ${JSON.stringify(v.fixAvailable)}`,
                );
              }
            });
          ' || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (pinned)
        if: always()
        with:
          name: audit-report
          path: audit-report.json

  # ─── Unit Tests ───────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (pinned)
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm test

  # ─── Client Doc Consistency ───────────────────────────
  # The client-facing docs are a deliverable, and they drifted silently
  # four times: a tally that never matched its own table, and three
  # "not built" claims for code that had already shipped.
  # tests/client-docs-consistency.test.ts catches those and is already
  # picked up by the `test` job's glob. This job runs it on its own so a
  # stale doc fails as a named, self-describing check instead of an
  # anonymous "Unit Tests" red. It needs no database, no prisma generate
  # and no browser — only node:fs and the markdown — so it is the cheapest
  # gate here and reports independently of the rest of the pipeline.
  doc-consistency:
    name: Client Doc Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (pinned)
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Ledger, tally and shipped-capability gates
        run: npx vitest run tests/client-docs-consistency.test.ts

  # ─── Concurrency Tests (real DB + real dev server) ────
  # Races the auth paths for real: 20 parallel refreshes of one refresh
  # token (CAS rotation must yield exactly one winner), 20 distinct tokens
  # (all must succeed), and 10 parallel wrong passwords (account must lock
  # exactly once). Needs a live server, so it spins one up against a real
  # Postgres service; the test file itself skips when NK_TEST_BASE_URL is
  # absent, so local `npm test` stays green without a server.
  concurrency-tests:
    name: Concurrency (DB races)
    runs-on: ubuntu-latest
    needs: [test]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NK_JWT_SECRET: ci-test-secret-0123456789abcdef0123456789abcdef
      NK_ENCRYPTION_KEY: ci-test-encryption-key-32bytes!!
      NK_GIFT_CODE_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      NK_OTP_DEV_MODE: '1'
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:4200
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (pinned)
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Start dev server
        run: |
          nohup npx next dev -p 4200 > dev-server.log 2>&1 &
          for i in $(seq 1 60); do
            sleep 2
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:4200/ || true)
            if [ "$code" = "200" ]; then echo "dev server up (attempt $i)"; exit 0; fi
          done
          echo "dev server did not become ready"; tail -50 dev-server.log; exit 1
      - name: Run concurrency tests
        run: NK_TEST_BASE_URL=http://127.0.0.1:4200 npx vitest run tests/admin-concurrency.test.ts
      - name: Verify RLS baseline (production review, High)
        run: node scripts/verify-rls.cjs
      - name: Upload dev server log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (pinned)
        with:
          name: dev-server-log
          path: dev-server.log

  # ─── Browser Smoke (roadmap §7/§8) ─────────────────
  # Minimal production smoke against a REAL database and a REAL production
  # build (`next start`, never the dev server — production mode fails
  # closed on NK_PAYMENT_MOCK by design). Three gates:
  #   1. Home page loads under the ENFORCED nonce CSP and hydrates.
  #   2. A guest walks checkout to a created order whose confirmationUuid
  #      link renders (§2 definition of done, link half).
  #   3. /api/v1/version reports the exact commit under test.
  # Opn keys stay absent: the checkout gate passes via the seeded
  # manual-transfer channel (union gate — exactly the §4 behavior).
  browser-smoke:
    name: Browser Smoke (CSP + checkout)
    runs-on: ubuntu-latest
    needs: [lint, test]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DATABASE_DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:4200
      GIT_SHA: ${{ github.sha }}
      GIT_REF: ${{ github.ref_name }}
      NK_JWT_SECRET: ci-test-secret-0123456789abcdef0123456789abcdef
      NK_ENCRYPTION_KEY: ci-test-encryption-key-32bytes!!
      NK_GIFT_CODE_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (pinned)
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Seed catalog + payment channel
        run: node scripts/seed-smoke.mjs
      - name: Seed management smoke fixtures (admin + stranded order + completed order + codes)
        run: node scripts/seed-management-smoke.mjs
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build production bundle
        run: |
          set -o pipefail
          # Teed to a file because the step's own log is only readable from the
          # run page by someone with repo admin rights. Annotations are the
          # only copy that reaches the checks API (and CI's failure-annotation
          # step) without them.
          npm run build 2>&1 | tee build-output.log && touch build-ok.flag
      - name: Emit build failure annotations
        if: failure()
        run: |
          # `failure()` is job-wide: without the sentinel this would also fire
          # when a LATER step failed and the build was perfectly fine, printing
          # confident nonsense about a build that never broke.
          if [ -f build-ok.flag ]; then exit 0; fi

          # A build killed at the runner level (OOM, out of disk, lost VM)
          # writes NOTHING. Run #89 died in 10s against a 34-59s norm and every
          # API surface reported only "exit code 1" — no clue what killed it.
          # Name that case rather than staying silent, because it is exactly the
          # one you cannot debug from the log.
          if [ ! -s build-output.log ]; then
            echo "::error title=next build produced no output::next build died before the compiler reported anything — the likely causes are a runner-level kill (OOM), out of disk, or a cancelled step. Normal build time is 35-60s."
            exit 0
          fi

          # Next colourises its output; raw escape bytes render as garbage in
          # annotations.
          strip_ansi() { sed -e 's/\x1b\[[0-9;]*[A-Za-z]//g'; }

          # 10, not 60: GitHub caps a step at 10 error annotations and silently
          # drops the rest, so a longer list is a list nobody reads.
          matches=$(strip_ansi < build-output.log | grep -nE "⨯|Error|error|Failed|failed|ENOENT|ENOSPC|EACCES|heap out of memory|ELIFECYCLE" | head -10 || true)
          if [ -n "$matches" ]; then
            echo "$matches" | while IFS= read -r line; do
              echo "::error title=next build failed::${line:0:400}"
            done
          else
            # No recognisable error line: emit the tail anyway. A silent step
            # is what made run #89 undiagnosable in the first place.
            echo "::error title=next build failed::no recognised error line in the output; last 10 lines follow (full log in the browser-smoke-artifacts artifact)."
            strip_ansi < build-output.log | tail -10 | while IFS= read -r line; do
              echo "::error title=next build failed::${line:0:400}"
            done
          fi
      - name: Start production server
        run: |
          nohup npx next start -p 4200 > smoke-server.log 2>&1 &
          for i in $(seq 1 60); do
            sleep 2
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:4200/ || true)
            if [ "$code" = "200" ]; then echo "prod server up (attempt $i)"; exit 0; fi
          done
          echo "prod server did not become ready"; tail -50 smoke-server.log; exit 1
      - name: Run browser smoke tests
        run: |
          set -o pipefail
          E2E_BASE_URL=http://127.0.0.1:4200 npx playwright test e2e/smoke.spec.ts e2e/management.spec.ts e2e/order-refund-resend.spec.ts 2>&1 | tee /tmp/pw-output.log
      - name: Emit smoke failure annotations
        if: failure()
        run: |
          grep -E "✘|✗|Error:|Timed out|TimeoutError|expected|locator|resolved to|passed|failed" /tmp/pw-output.log | tail -60 | while IFS= read -r line; do
            echo "::error::${line:0:400}"
          done
      - name: Verify deployed SHA matches the commit under test
        run: |
          body=$(curl -s http://127.0.0.1:4200/api/v1/version)
          echo "version: $body"
          echo "$body" | grep -q "\"gitSha\":\"$GIT_SHA\""
      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (pinned)
        with:
          name: browser-smoke-artifacts
          path: |
            playwright-report/
            test-results/
            smoke-server.log
            build-output.log
          if-no-files-found: ignore

  # ─── Build ────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    # Production review MEDIUM-2: the build (and the deploy that follows it)
    # must be gated by EVERY other check — a failing security audit or DB
    # concurrency/RLS run must not promote an artifact.
    needs: [lint, test, doc-consistency, audit, concurrency-tests, browser-smoke]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (pinned)
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          # Same value the other jobs use. The previous `ci-test-secret` was
          # 14 characters and src/lib/jwt.ts refuses to sign with anything
          # under 32 — a throw this job only avoided by never reaching it.
          NK_JWT_SECRET: ci-test-secret-0123456789abcdef0123456789abcdef
          NK_ENCRYPTION_KEY: ci-test-encryption-key-32bytes!!
          NK_CSP_REPORT_ONLY: 'true'
          # Prerendering never queries these — CI has no database.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
