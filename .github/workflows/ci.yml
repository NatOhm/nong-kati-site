# ─── Nong-Kati — CI Pipeline ────────────────────────────
# Default (and deployed) branch is `master` — Vercel Git
# integration handles deployments; CI gates every push/PR.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ─── Lint & Typecheck ────────────────────────────────
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (pinned)
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # --max-warnings=0 lands once the 17 pre-existing warnings are cleaned up;
      # errors still fail the build.
      - run: npx eslint .
      - run: npx tsc --noEmit

  # ─── Dependency Audit ─────────────────────────────────
  # Blocking (was report-only): after the Next.js 15.5 upgrade there are no
  # known high/critical advisories in the tree, so a failure is a real
  # regression and should hold the deploy. The full JSON report is still
  # uploaded on every run.
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (pinned)
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: npm audit (report + gate)
        if: always()
        run: |
          npm audit --json > audit-report.json || true
          npm audit --audit-level=high
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (pinned)
        if: always()
        with:
          name: audit-report
          path: audit-report.json

  # ─── Unit Tests ───────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (pinned)
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm test

  # ─── Concurrency Tests (real DB + real dev server) ────
  # Races the auth paths for real: 20 parallel refreshes of one refresh
  # token (CAS rotation must yield exactly one winner), 20 distinct tokens
  # (all must succeed), and 10 parallel wrong passwords (account must lock
  # exactly once). Needs a live server, so it spins one up against a real
  # Postgres service; the test file itself skips when NK_TEST_BASE_URL is
  # absent, so local `npm test` stays green without a server.
  concurrency-tests:
    name: Concurrency (DB races)
    runs-on: ubuntu-latest
    needs: [test]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NK_JWT_SECRET: ci-test-secret-0123456789abcdef0123456789abcdef
      NK_ENCRYPTION_KEY: ci-test-encryption-key-32bytes!!
      NK_GIFT_CODE_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      NK_OTP_DEV_MODE: '1'
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:4200
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (pinned)
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Start dev server
        run: |
          nohup npx next dev -p 4200 > dev-server.log 2>&1 &
          for i in $(seq 1 60); do
            sleep 2
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:4200/ || true)
            if [ "$code" = "200" ]; then echo "dev server up (attempt $i)"; exit 0; fi
          done
          echo "dev server did not become ready"; tail -50 dev-server.log; exit 1
      - name: Run concurrency tests
        run: NK_TEST_BASE_URL=http://127.0.0.1:4200 npx vitest run tests/admin-concurrency.test.ts
      - name: Verify RLS baseline (production review, High)
        run: node scripts/verify-rls.cjs
      - name: Upload dev server log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (pinned)
        with:
          name: dev-server-log
          path: dev-server.log

  # ─── Browser Smoke (roadmap §7/§8) ─────────────────
  # Minimal production smoke against a REAL database and a REAL production
  # build (`next start`, never the dev server — production mode fails
  # closed on NK_PAYMENT_MOCK by design). Three gates:
  #   1. Home page loads under the ENFORCED nonce CSP and hydrates.
  #   2. A guest walks checkout to a created order whose confirmationUuid
  #      link renders (§2 definition of done, link half).
  #   3. /api/v1/version reports the exact commit under test.
  # Opn keys stay absent: the checkout gate passes via the seeded
  # manual-transfer channel (union gate — exactly the §4 behavior).
  browser-smoke:
    name: Browser Smoke (CSP + checkout)
    runs-on: ubuntu-latest
    needs: [lint, test]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DATABASE_DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:4200
      GIT_SHA: ${{ github.sha }}
      GIT_REF: ${{ github.ref_name }}
      NK_JWT_SECRET: ci-test-secret-0123456789abcdef0123456789abcdef
      NK_ENCRYPTION_KEY: ci-test-encryption-key-32bytes!!
      NK_GIFT_CODE_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (pinned)
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Seed catalog + payment channel
        run: node scripts/seed-smoke.mjs
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build production bundle
        run: npm run build
      - name: Start production server
        run: |
          nohup npx next start -p 4200 > smoke-server.log 2>&1 &
          for i in $(seq 1 60); do
            sleep 2
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:4200/ || true)
            if [ "$code" = "200" ]; then echo "prod server up (attempt $i)"; exit 0; fi
          done
          echo "prod server did not become ready"; tail -50 smoke-server.log; exit 1
      - name: Run browser smoke tests
        run: E2E_BASE_URL=http://127.0.0.1:4200 npx playwright test e2e/smoke.spec.ts
      - name: Verify deployed SHA matches the commit under test
        run: |
          body=$(curl -s http://127.0.0.1:4200/api/v1/version)
          echo "version: $body"
          echo "$body" | grep -q "\"gitSha\":\"$GIT_SHA\""
      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (pinned)
        with:
          name: browser-smoke-artifacts
          path: |
            playwright-report/
            test-results/
            smoke-server.log
          if-no-files-found: ignore

  # ─── Build ────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    # Production review MEDIUM-2: the build (and the deploy that follows it)
    # must be gated by EVERY other check — a failing security audit or DB
    # concurrency/RLS run must not promote an artifact.
    needs: [lint, test, audit, concurrency-tests, browser-smoke]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (pinned)
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NK_JWT_SECRET: ci-test-secret
          NK_ENCRYPTION_KEY: ci-test-encryption-key-32bytes!!
          NK_CSP_REPORT_ONLY: 'true'
          # Prerendering never queries these — CI has no database.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
