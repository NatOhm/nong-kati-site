# Secret scan — blocks a credential from being committed, and finds one that
# already was.
#
# Runs scripts/secret-scan.mjs, which scans (a) the tree a commit would produce
# and (b) the whole git history with gitleaks. `fetch-depth: 0` is required for
# (b): a shallow clone would only see the tip, and a secret removed in a later
# commit stays in the clone forever.
#
# Why this exists: a production MySQL URL, a Resend key and a Slip2Go key have
# already leaked out of this project — through terminal output and chat rather
# than git, which is exactly why nothing caught them. This gate is the commit
# boundary, and the weekly run re-checks history as the ruleset grows.
#
# Allowlisted matches live in .gitleaks.toml and are scoped to specific files
# (CI test constants, two setup guides, one test fixture) — never to a whole
# directory, so a real key pasted into another test or doc still fails.
name: Secret scan

on:
  push:
  pull_request:
  schedule:
    # Mondays 04:17 UTC — off the hour, and independent of CI's own schedule.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (tree + history)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned)
        with:
          # Required: the history scan is the point of this job.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (pinned)
        with:
          node-version-file: .nvmrc

      - name: Install gitleaks (pinned)
        run: |
          set -euo pipefail
          VERSION=8.30.1
          curl -sSL --max-time 120 -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Scan tree and history
        run: node scripts/secret-scan.mjs
