# ─── Nong-Kati — Production Health Monitor ───────────────
# Watches the LIVE site on Hostatom/Plesk (not a preview build):
#   node scripts/monitor-health.mjs
# It records process uptime across checks, classifies an uptime reset as an
# expected Passenger idle reap or a real unexpected restart, and exits
# non-zero on an alert so this job goes red.
#
# WHY A SCHEDULE IN CI: production runs on shared hosting we cannot install a
# daemon on. GitHub cron is the only always-on scheduler available to us, and
# the site is publicly reachable, so an external checker is the whole job.
#
# ALERTING: a non-zero exit fails the job, which notifies the repo owner by
# email and leaves a red run on the repo. Set the PRODUCTION_ALERT_WEBHOOK
# secret to also POST to Slack/Discord/Line (body carries both "text" and
# "content" — Discord ignores "text").
# Adding a paid third party is deliberately NOT required — see
# docs/production-health-monitoring.md for the UptimeRobot/Healthchecks
# options and why the built-in uptime checker cannot see restarts at all.
#
# ASKS FOR EVERY 10 MINUTES, not 5: the only thing this can catch that a
# 30-minute check would miss is "down for 10 minutes instead of 30".
# The idle-reap classifier compares against idleReapSeconds=180, which is
# independent of this interval.
#
# WHAT IT ACTUALLY GETS (measured 2026-11-05, 12 runs): NOT 10 minutes. The
# runs landed 4–5 times a day, 3–5 hours apart — 01:51Z, 21:49Z, 16:00Z,
# 10:53Z, 07:56Z … GitHub throttles `schedule` on a public repo to "best
# effort" and this repo is public. All runs were green, so the cron is not
# broken; it is slow. Consequences are listed on the housekeeping step below.
# For health checks the Plesk pinger in docs/production-health-monitoring.md
# §3a is the real 10-minute watchdog; this job is the independent vantage
# point and the dead-man's-switch ping.

name: Production Health Monitor

on:
  schedule:
    # Asks for every 10 minutes, 24/7; lands hours apart (see the header).
    # GitHub disables scheduled workflows on repos with 60 days of
    # inactivity — the watchdog is only as alive as the repo.
    - cron: '*/10 * * * *'
    # Daily housekeeping tick: the 30-day slip-evidence retention sweep runs
    # once a day (03:17 UTC ≈ 10:17 ICT) instead of on every health tick.
    - cron: '17 3 * * *'
  # Manual trigger: run it before/after a deploy, or when the alert email
  # itself is the thing you are suspicious of.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One monitor at a time; a queued run would compare its uptime against a
  # state file a newer run has already advanced, producing a phantom restart.
  group: prod-health-monitor
  cancel-in-progress: false

jobs:
  health:
    name: Health + restart check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Optional. Unset in most repos — the job still alerts via the red run.
      PRODUCTION_ALERT_WEBHOOK: ${{ secrets.PRODUCTION_ALERT_WEBHOOK }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned)

      # No setup-node and no `npm ci`: the monitor imports only node: builtins,
      # so the job starts in seconds and cannot break because a dependency did.
      - name: Restore previous uptime state
        id: state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0 (pinned)
        with:
          path: .prod-health
          # The trailing - keys to "the most recent cache whose prefix matches",
          # which is how a rolling state survives across ephemeral runners.
          key: prod-health-state-${{ github.run_id }}
          restore-keys: |
            prod-health-state-

      - name: Check production health
        id: check
        run: |
          # GitHub's default shell runs with `bash -e`, so a failing pipeline
          # aborts the step AT that line. Reading ${PIPESTATUS[0]} and writing
          # the output afterwards therefore never ran — the step went red (which
          # is what we want) but `steps.check.outputs.exit_code` was silently
          # always empty. Verified by replaying this block locally.
          #
          # So suspend errexit around the pipeline, record the real exit code,
          # then restore it and exit with that code. Do NOT "simplify" this back
          # to a bare pipeline: the annotation step is the only thing that makes
          # a red run legible.
          set -o pipefail
          set +e
          node scripts/monitor-health.mjs \
            --url https://nongkatistore.com \
            --state .prod-health/state.json \
            --history .prod-health/history.ndjson \
            --webhook "$PRODUCTION_ALERT_WEBHOOK" 2>&1 | tee monitor.log
          status=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Explain the failure on the run page
        if: failure()
        run: |
          # Without this the run is just "Process completed with exit code 1",
          # which is the same message for "site is down", "network hiccup" and
          # "the monitor is misconfigured". Name the actual verdict.
          echo "monitor exited: ${{ steps.check.outputs.exit_code || 'unknown' }}"
          if [ ! -s monitor.log ]; then
            echo "::error title=production monitor produced no output::the monitor died before reporting — likely a runner-level kill. Nothing about production can be concluded from this run."
            exit 0
          fi
          strip_ansi() { sed -e 's/\x1b\[[0-9;]*[A-Za-z]//g'; }
          verdict=$(strip_ansi < monitor.log | grep -E '^(✖|⚠)' | head -3 || true)
          if [ -n "$verdict" ]; then
            echo "$verdict" | while IFS= read -r line; do
              echo "::error title=nongkatistore.com health::${line:0:300}"
            done
          else
            echo "::error title=nongkatistore.com health::monitor exited non-zero without a recognisable verdict line; see monitor.log."
          fi

      - name: Persist state for the next run
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0 (pinned)
        with:
          path: .prod-health
          key: prod-health-state-${{ github.run_id }}

      # ─── Housekeeping crons ───────────────────────────────
      # The internal sweep endpoints (orders/promotions expiry, email-outbox
      # drain, slip retention) are fail-closed and had NO caller anywhere —
      # audit finding 2 (2026-10-26). Shared hosting runs no daemon, so this
      # always-on job is their scheduler. The dated tick runs the sweeps,
      # the daily tick adds retention, workflow_dispatch runs everything; a
      # red health step above skips this one (no point sweeping a dead site).
      #
      # CADENCE IS HOURS, NOT 10 MINUTES (measured 2026-11-05). What that
      # costs, checked one by one: holds no longer depend on it at all (v1.1.13
      # filters them by `createdAt`), and customer mail does not either (the
      # outbox drains through `after()` on enqueue; this call is recovery).
      # What it does cost: a `pending_payment` row keeps saying "awaiting
      # payment" until the next tick (NK-2026-000190's window closed 05:01Z
      # and it still read unpaid at 06:38Z), its expiry notice is late, and an
      # expired promotion stays redeemable for up to a tick. Paying late is safe —
      # v1.1.12 accepts a slip after expiry — so the lag costs tidiness and a
      # few late-day coupons, not money.
      #
      # To make the sweeps tick properly, add them to the Plesk task that
      # already fires on `:10` (docs/production-health-monitoring.md §3b) —
      # that needs NK_CRON_SECRET on the server side, out of band, because the
      # Plesk task field renders plain text and this repo is public.
      #
      # NK_CRON_SECRET must match the server .env; until it is added as a
      # repo secret this step fails LOUDLY (silent disablement was the bug).
      - name: Housekeeping crons (expiry, drain, daily slip retention)
        env:
          NK_CRON_SECRET: ${{ secrets.NK_CRON_SECRET }}
        run: |
          if [ -z "$NK_CRON_SECRET" ]; then
            echo "::error title=NK_CRON_SECRET missing::add it as a repo secret (same value as the server .env). The internal endpoints fail closed with 503 until then, so no sweep can run."
            exit 1
          fi
          endpoints="internal/orders/expire internal/promotions/expire internal/email-outbox/drain"
          # Daily (not every 10 minutes): both of these are storage housekeeping
          # that scans a table or a directory, so a tick per day is the right
          # cadence. `?apply=1` is what turns the media sweep from a report into
          # a deletion — without it the endpoint only lists orphans.
          if [ "${{ github.event.schedule }}" != "*/10 * * * *" ]; then
            endpoints="$endpoints internal/settings/slip-retention internal/media/sweep?apply=1"
          fi
          fail=0
          failed=""
          # Read the STATUS, not just curl's exit code. With `-f` a 401 and a 503
          # collapse into the same "failed", and they mean opposite things:
          #   401 UNAUTHENTICATED  → the server HAS a NK_CRON_SECRET and it differs
          #                          from this repo secret (copy server → repo secret).
          #   503 SWEEP_DISABLED   → the server has NO secret, so the sweep is
          #                          switched off (add it in Plesk → Node.js →
          #                          Environment; do NOT touch the repo secret).
          # One message for both sent operators to the wrong panel: measured
          # 2026-11-21, 11 of 12 red runs were the 401.
          for ep in $endpoints; do
            # `|| true`, not `|| code=000`: --max-time can fire AFTER the status
            # line, so curl exits 28 having already printed 200. Overwriting that
            # with 000 would blame DNS/TLS for a server that answered. A real
            # code is kept; anything empty or non-numeric (no response at all) is
            # normalised to 000 below. curl's own stderr still reaches the log.
            code="$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' -X POST \
              -H "x-cron-token: $NK_CRON_SECRET" "https://nongkatistore.com/api/v1/$ep")" || true
            case "$code" in '' | *[!0-9]*) code=000 ;; esac
            # Status only, deliberately: the five routes answer with different
            # JSON shapes, so asserting on the body would go red on a harmless
            # shape change and teach the operator to ignore this channel. A 200
            # means the route ran; the annotation below is for everything else.
            if [ "$code" = "200" ]; then
              echo "ok: $ep"
              continue
            fi
            case "$code" in
              401)
                echo "::error title=housekeeping 401 token mismatch::$ep: 401 UNAUTHENTICATED — the server's NK_CRON_SECRET differs from this repo secret, so copy the server value in (Plesk → Node.js → Environment): gh secret set NK_CRON_SECRET. No restart, no redeploy."
                ;;
              503)
                echo "::error title=housekeeping 503 secret unset::$ep: 503 SWEEP_DISABLED — NK_CRON_SECRET is missing on the server, so the sweep fails closed. Add it in Plesk → Node.js → Environment and restart the app; the repo secret is not the problem."
                ;;
              000)
                echo "::error title=housekeeping no response::$ep: no HTTP response (connect/DNS/TLS/timeout) — the site is unreachable, not a secret problem."
                ;;
              *)
                echo "::error title=housekeeping HTTP $code::$ep: HTTP $code, neither 401 nor 503 — read that endpoint's own log."
                ;;
            esac
            failed="$failed $ep($code)"
            fail=1
          done
          # One webhook message per RUN, never one per endpoint: a dead site
          # fails every sweep at once, and four near-identical pings teach an
          # operator to mute the channel — which then hides the health alerts
          # sharing it. Unset webhook → skip; the red run and its ::error
          # annotations still report either way.
          if [ "$fail" = "1" ] && [ -n "$PRODUCTION_ALERT_WEBHOOK" ]; then
            curl -fsS --max-time 10 -X POST -H 'content-type: application/json' \
              -d "{\"text\":\"🚨 nongkatistore.com housekeeping failed:$failed\",\"content\":\"🚨 nongkatistore.com housekeeping failed:$failed\"}" \
              "$PRODUCTION_ALERT_WEBHOOK" || echo "webhook delivery failed (non-fatal)"
          fi
          exit $fail

      # ─── Can the shop actually sell? ──────────────────────
      # A green /api/v1/health only proves the app reached the database. On
      # 2026-11-19 every check was green while the catalog served 29 published
      # products with a sellable total of ZERO: every variant was out of stock
      # and the last 13 `available` GiftCodes were detached from any variant,
      # so they counted as inventory and appeared in no product row. Nothing
      # could be bought and nothing reported it.
      #
      # AFTER the housekeeping step on purpose: a red check here must not skip
      # the sweeps, because an empty shop still needs its unpaid orders to
      # expire. The endpoint is read-only and takes the same cron token. The
      # script recomputes the verdict from the numbers instead of trusting the
      # endpoint's own `ok` field, exits 1 only for the shop and 2 for "the
      # check could not run" (no token, 401/503, 404 before the build carrying
      # the route is deployed, unreachable).
      - name: Sellable-stock check (is anything for sale?)
        env:
          NK_CRON_SECRET: ${{ secrets.NK_CRON_SECRET }}
        run: |
          if [ -z "$NK_CRON_SECRET" ]; then
            echo "::error title=NK_CRON_SECRET missing::the sellable-stock check needs the same value as the server .env, or it cannot authenticate. Skipping would report a shop with nothing for sale as fine."
            exit 1
          fi
          node scripts/check-sellable.mjs \
            --url https://nongkatistore.com \
            --webhook "$PRODUCTION_ALERT_WEBHOOK"

      # ─── The one step that reaches a person ───────────────
      # A red run notifies nobody who is not already staring at the run page:
      # GitHub's failure mail goes to whoever last edited the cron syntax, and
      # it cannot report a schedule that stopped firing at all. healthchecks.io
      # is the free external watchdog, but it has to be told the VERDICT, not
      # merely "a run happened":
      #   job green → ping the check, which keeps it up
      #   job red   → ping <url>/fail, which makes healthchecks alert NOW
      # This step used to ping unconditionally on `always()`, so a failed run
      # reported a healthy check — the switch could only ever notice silence,
      # and on 2026-11-21 eleven red runs out of twelve paged nobody.
      # It covers all three monitored things (site health, housekeeping sweeps,
      # sellable stock) in one channel, which matters precisely because none of
      # them alert on its own when PRODUCTION_ALERT_WEBHOOK is unset.
      - name: Report the verdict to healthchecks.io
        if: always()
        env:
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
        run: |
          if [ -z "$HEALTHCHECKS_PING_URL" ]; then
            # Loud, not "optional": with no ping URL there is no path from a
            # red monitor to a human at all, which is how the Nov 21 failures
            # passed unseen. The annotation is the run page's own proof.
            echo "::error title=no alert channel::HEALTHCHECKS_PING_URL is unset, so a red monitor pages nobody. Create a check at https://healthchecks.io (period 10 min, grace 20 min, email integration) and set this repo secret to its ping URL — see docs/production-health-monitoring.md §3."
            exit 0
          fi
          # Tolerate a trailing slash: /fail is appended literally, and //fail
          # is not a route healthchecks answers.
          url="${HEALTHCHECKS_PING_URL%/}"
          if [ "${{ job.status }}" = "success" ]; then
            echo "job green — pinging the check as up"
            curl -fsS --max-time 10 "$url" || echo "ping failed (non-fatal)"
          else
            echo "job ${{ job.status }} — reporting FAILURE so healthchecks alerts"
            # `|| echo`: a dead watchdog endpoint must not fail the job that is
            # already reporting the real outage.
            curl -fsS --max-time 10 "$url/fail" || echo "fail-ping failed (non-fatal)"
          fi

      - name: Upload uptime history
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (pinned)
        with:
          name: prod-health-history
          path: |
            .prod-health/
            monitor.log
          retention-days: 30
          if-no-files-found: ignore